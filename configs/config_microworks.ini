[GSHEET]
# ID of the sheet (usually in the URL of the sheet: docs.google.com/spreadsheets/d/[ID]/edit?...)
SheetID: 1ujmF8Iwrb32tHTlV8MTsuBK1SwC525hD1Iv83qb2Qkc


[PARAMS]
# How many players per lobby maximum
MaxPlayers: 16
# Multiplicator per game, where the first number if the multiplicator for game 1, and all values are separated by a comma. Set to 0 (without any comma or further values) if all games should yield the same amount of points.
# For example, GameMultiplicators = 0 -> all games will have a multiplicator of 1.
# For example, GameMultiplicators = 0.6,1,0.9 -> Game 1 will have a multiplicator of 0.6, Game 2 will have a multiplicator of 1, and Game 3 will have a multiplicator of 0.9.
GameMultiplicators: 0.5,1,1,1,1,0.7,0.7
# Multiplicator for lobbies (not considering game 1 where lobbies are random). Set to 0 if all lobbies should yield the same amount of points.
# For example, if there are 4 lobbies (determined automatically) and LobbyMultiplicator is set to 0.5, Lobby 4 will have a multiplicator of 1, L3 will have 1.5, L2 will have 2, and L1 will have 2.5.
LobbyMultiplicator: 0.1
# If there is a user that should be prioritized to be host (i.e. their name must be the first of the lobby), write their username here. Else, leaving that field empty will make that feature be ignored.
PrioritizeHost: 
# If there is a player whose lobby must be among the lobbies with the most players (e.g. if admins are supposed to fill the slots in the other lobbies), write their username here. Else, leaving that field empty will make that feature be ignored.
PrioritizeFull: VelNewt


[USERNAMES]
# INPUT
# The name of the sheet for the initial usernames list
Sheet: Feuille 1
# The range of cells for the initial usernames list
Range: C3:C66


# Add a [GAMEx] section for every new lobby (x being the number of the lobby, i.e. 1, 2, 3 etc.)
[GAME1]
# OUTPUT
# The name of the sheet for the list of usernames for that game (which will be ordered and dispatched to accomodate the lobbies and then printed on the sheet)
UsernamesSheet: Feuille 1
# The range of cells for the list of usernames for that game (same)
UsernamesRange: F3:F66

# INPUT
# The name of the sheet for the scores of that game
ScoresSheet: Feuille 1
# The range of cells for the list of usernames that got a score at that game
ScoresUsernameRange: F3:F66
# The range of cells for the scores of that game (the rows are supposed to correspond to the usernames defined in ScoresUsernameRange)
ScoresRange: G3:G66

# OUTPUT
# The name of the sheet for the intermediate results to print
IntermediateResultsSheet: Feuille 1
# The range of cells for the list of usernames that will get intermediate results at that game
IntermediateResultsUsernameRange: F3:F66
# The range of the cells for the intermediate results to print
IntermediateResultsRange: H3:H66


